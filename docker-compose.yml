services:

  # ==========================================================
  # Workspace para Visual Studio Code (Dev Container)
  # ==========================================================
  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: glaucoma-dev-workspace
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - mysql_network

  # ==========================================================
  # MySQL
  # Al crearse el volumen por primera vez ejecuta, en orden
  # alfabético, los scripts de ./sql (01_schema … 07_events).
  # ==========================================================
  mysql_db:
    image: mysql:8.4
    container_name: glaucoma_mysql_db
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Bogota
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      # Persistencia de datos
      - mysql_data:/var/lib/mysql
      # Scripts de inicialización (solo corren con el volumen vacío)
      - ./sql:/docker-entrypoint-initdb.d:ro
      # Ejercicios disponibles dentro del contenedor (solo lectura)
      - ./ejercicios:/ejercicios:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - mysql_network

  # ==========================================================
  # phpMyAdmin
  # ==========================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: glaucoma_phpmyadmin
    depends_on:
      mysql_db:
        condition: service_healthy
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
    ports:
      - "${PHPMYADMIN_PORT}:80"
    restart: unless-stopped
    networks:
      - mysql_network

# ============================================================
# Volúmenes
# ============================================================
volumes:
  mysql_data:

# ============================================================
# Redes
# ============================================================
networks:
  mysql_network:
    driver: bridge
